name: Deploy Angular app to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Angular app
        run: npm run build -- --base-href=/${{ github.event.repository.name }}/

      - name: Verify dashboard banner assets
        run: |
          for banner in banner-1.png banner-2.png banner-3.png banner-4.png; do
            test -s "dist/cashfree-payment-app/browser/assets/dashboard/$banner"
          done

      - name: Support direct route navigation
        run: cp dist/cashfree-payment-app/browser/index.html dist/cashfree-payment-app/browser/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/cashfree-payment-app/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed dashboard banners
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for banner in banner-1.png banner-2.png banner-3.png banner-4.png; do
            curl --fail --silent --show-error --location \
              --retry 8 --retry-all-errors --retry-delay 10 \
              "${PAGE_URL%/}/assets/dashboard/$banner" \
              --output /dev/null
          done
