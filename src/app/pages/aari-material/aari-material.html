<main class="container-xl py-5">
  <section aria-labelledby="aari-material-title">
    <div class="aari-material-heading">
      <div>
        <p class="aari-material-eyebrow">Explore our collections</p>
        <h1 id="aari-material-title">Aari Material</h1>
      </div>
      <a class="aari-material-view-all" routerLink="/collections">
        View all <i class="bi bi-arrow-right" aria-hidden="true"></i>
      </a>
    </div>

    <div class="aari-material-grid">
      @for (category of categories; track category.name) {
        <a class="aari-material-card" [routerLink]="['/collection']" [queryParams]="{ q: category.searchTerm }">
          <div class="aari-material-card-image">
            <img [ngSrc]="category.image" [alt]="category.name" width="720" height="540" loading="lazy">
            <span class="aari-material-card-arrow" aria-hidden="true"><i class="bi bi-arrow-up-right"></i></span>
          </div>
          <div class="aari-material-card-info">
            <h2>{{ category.name }}</h2>
          </div>
        </a>
      }
    </div>
  </section>
</main>
